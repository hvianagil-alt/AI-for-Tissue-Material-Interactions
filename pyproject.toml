[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tissuelab"
version = "0.1.0"
description = "TissueLab AI — predict and inverse-design hydrogel–chondrocyte interactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pydantic>=2.6",
  "joblib>=1.3",
  "streamlit>=1.32",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tissuelab-app = "tissuelab.serve:main"
tissuelab-build-dataset = "tissuelab.build_dataset:main"
tissuelab-train = "tissuelab.train:main"
tissuelab-load-database = "tissuelab.load_database:main"
tissuelab-harvest-amass = "tissuelab.harvest_amass:main"
tissuelab-rank-papers = "tissuelab.rank_papers:main"
tissuelab-benchmark = "tissuelab.benchmark:main"
tissuelab-ingest-literature = "tissuelab.ingest_literature:main"
tissuelab-europepmc = "tissuelab.europepmc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
